name: securityblackrock-webmail

# Separate from Mailcow. This file does not attach to the Mailcow network
# and does not publish ports 80, 443, 993, or 587.
services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MAIL_MODE: imap
      API_PORT: "4100"
      DATA_DIR: /data
      MAIL_TLS_CA_FILE: /certs/mail.securityblackrock.com.pem
      TRUST_PROXY: "1"
    volumes:
      - webmail_data:/data
      - ./certs:/certs:ro
    networks:
      - webmail
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:4100
    depends_on:
      api:
        condition: service_healthy
    networks:
      - webmail
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    networks:
      - webmail
    restart: unless-stopped

networks:
  webmail:
    name: securityblackrock_webmail
    driver: bridge

volumes:
  webmail_data:
